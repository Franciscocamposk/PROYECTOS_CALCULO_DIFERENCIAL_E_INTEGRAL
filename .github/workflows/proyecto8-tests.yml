
name: Proyecto 8 - Pruebas automaticas

on:
  push:
    paths:
      - "PROYECTO_2/HERNANDEZ TORRENTES JOSEPH STEVEN/**"
      - ".github/workflows/proyecto8-tests.yml"
  pull_request:
    paths:
      - "PROYECTO_2/HERNANDEZ TORRENTES JOSEPH STEVEN/**"
      - ".github/workflows/proyecto8-tests.yml"
  workflow_dispatch:

jobs:
  pruebas:
    name: Ejecutar pruebas del Proyecto 8
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "PROYECTO_2/HERNANDEZ TORRENTES JOSEPH STEVEN"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "PROYECTO_2/HERNANDEZ TORRENTES JOSEPH STEVEN/requirements.txt"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas automaticas
        run: python -m pytest -q
